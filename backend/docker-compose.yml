# Base locale identique à l'hébergement Namecheap (MariaDB 11.4).
services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: aerowatch
      MARIADB_USER: aerowatch
      MARIADB_PASSWORD: aerowatch
      MARIADB_ROOT_PASSWORD: aerowatch-root
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3308:3306"
    volumes:
      - mariadb:/var/lib/mysql
volumes:
  mariadb:
